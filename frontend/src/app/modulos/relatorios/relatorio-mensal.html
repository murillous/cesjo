<form class="escolha" [formGroup]="escolha" (ngSubmit)="gerar()" aria-label="Mês do relatório">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Mês</mat-label>
    <mat-select formControlName="mes">
      @for (nome of meses; track nome; let i = $index) {
        <mat-option [value]="i + 1" [disabled]="mesFuturo(i + 1)">{{ nome }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Ano</mat-label>
    <mat-select formControlName="ano">
      @for (ano of anos; track ano) {
        <mat-option [value]="ano">{{ ano }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <button matButton="filled" type="submit" [disabled]="carregando()">Gerar relatório</button>
</form>

@if (erro(); as mensagem) {
  <p class="aviso-erro" role="alert">{{ mensagem }}</p>
} @else if (relatorio(); as dados) {
  <app-quadro-relatorio
    [relatorio]="dados"
    [url]="urlExportacao"
    [parametros]="{ mes: mesGerado() }"
  />
} @else {
  <p class="texto-secundario">Gerando…</p>
}

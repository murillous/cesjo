name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Os runners Ubuntu do GitHub têm Docker, então os testes com Testcontainers rodam aqui.
      - name: Build e testes
        run: ./mvnw -B verify

      - name: Publicar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste-backend
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Enquanto frontend/package.json não existir (issue #11), os passos abaixo são pulados e o job passa.
      - name: Verificar se o frontend existe
        id: frontend
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json não encontrado; job do frontend sem nada a fazer."
          fi

      - name: Configurar Node
        if: steps.frontend.outputs.existe == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        if: steps.frontend.outputs.existe == 'true'
        run: npm ci

      - name: Lint
        if: steps.frontend.outputs.existe == 'true'
        run: npm run lint

      - name: Testes
        if: steps.frontend.outputs.existe == 'true'
        run: npm run test:ci

      - name: Build
        if: steps.frontend.outputs.existe == 'true'
        run: npm run build

  # Imagens e compose de produção (issue #20, ADR 0053). Constrói as imagens sem publicar e sobe a
  # pilha inteira com domínio localhost para conferir Caddy, proxy de /api, Actuator e Postgres.
  implantacao:
    name: implantacao
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy
    env:
      # compose.ci.yaml (gerado abaixo) guarda o repositório restic numa pasta do runner, que sobrevive
      # ao "docker compose down -v" do teste de recuperação de desastres.
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - uses: actions/checkout@v7

      # Os workflows agendados (monitoramento e relatório de uptime) só rodam na branch padrão;
      # aqui eles são ao menos validados.
      - name: Validar os workflows
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Validar o compose com o .env.example
        run: |
          cp .env.example .env
          cp backup.env.example backup.env
          COMPOSE_FILE=compose.yaml docker compose config --quiet

      - name: Gerar .env de teste (dados fictícios, só para este job)
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^SGI_DOMINIO=.*|SGI_DOMINIO=localhost|" \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^SGI_CRIPTOGRAFIA_CHAVES_PROD1=.*|SGI_CRIPTOGRAFIA_CHAVES_PROD1=$(openssl rand -base64 32)|" \
            .env
          # O CI guarda o repositório restic numa pasta do runner; em produção o destino fica fora da VPS.
          cp backup.env.example backup.env
          sed -i \
            -e "s|^RESTIC_REPOSITORY=.*|RESTIC_REPOSITORY=/repositorio-ci|" \
            -e "s|^RESTIC_PASSWORD=.*|RESTIC_PASSWORD=$(openssl rand -hex 24)|" \
            backup.env
          mkdir -p repositorio-ci
          printf 'services:\n  backup:\n    volumes:\n      - ./repositorio-ci:/repositorio-ci\n' > compose.ci.yaml

      - name: Construir as imagens
        run: docker compose build

      - name: Subir a pilha e esperar os healthchecks
        run: docker compose up -d --wait --wait-timeout 240

      - name: Testes de fumaça
        # grep sem -q lê a entrada toda: com pipefail, o -q mataria o produtor com SIGPIPE.
        run: |
          set -euo pipefail
          echo "Frontend servido pelo Caddy"
          curl -fsSk https://localhost/ | grep '<app-root' > /dev/null
          echo "Rota da SPA cai no index.html"
          curl -fsSk https://localhost/lista-espera | grep '<app-root' > /dev/null
          echo "HTTP redireciona para HTTPS"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "308"
          echo "Proxy de /api chega na aplicação"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/sessao/csrf)" = "200"
          echo "API exige sessão"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/notificacoes)" = "401"
          echo "Actuator não é publicado pelo Caddy"
          if curl -sk https://localhost/actuator/health | grep '"status"' > /dev/null; then exit 1; fi
          echo "Cache: index.html revalidado, bundle com hash imutável"
          curl -sSkI https://localhost/ | grep -i '^cache-control: no-cache' > /dev/null
          bundle="$(curl -fsSk https://localhost/ | grep -o 'main-[A-Za-z0-9]*\.js' | head -1)"
          curl -sSkI "https://localhost/$bundle" | grep -i '^cache-control: public, max-age=31536000, immutable' > /dev/null
          echo "Saúde pública em /saude, só com o estado agregado (issue #23)"
          saude="$(curl -fsSk https://localhost/saude)"
          echo "$saude"
          case "$saude" in *'"status":"UP"'*) ;; *) exit 1 ;; esac
          case "$saude" in *components*|*details*) echo "detalhes expostos em /saude"; exit 1 ;; esac
          echo "Actuator saudável dentro da rede"
          docker compose exec -T app curl -fsS http://localhost:8080/actuator/health | grep '"status":"UP"' > /dev/null
          echo "Aplicação roda sem root"
          test "$(docker compose exec -T app id -u)" != "0"

      - name: Backup e leitura de volta (issue #21)
        run: |
          set -euo pipefail
          docker compose exec -T backup backup.sh
          echo "Um snapshot no repositório"
          test "$(docker compose exec -T backup restic snapshots --json | grep -o '"short_id"' | wc -l)" = "1"
          echo "O dump do snapshot é um backup válido do Postgres com as tabelas da aplicação"
          docker compose exec -T backup sh -c \
            'restic dump latest /var/backups/sgi/cesjo.dump | pg_restore --list' | grep 'TABLE public conta_acesso' > /dev/null
          echo "O volume de arquivos entrou no snapshot"
          docker compose exec -T backup restic ls latest | grep '^/dados/arquivos' > /dev/null
          echo "O dump em claro não ficou no contêiner"
          if docker compose exec -T backup test -e /var/backups/sgi/cesjo.dump; then exit 1; fi
          echo "Segundo backup e retenção"
          docker compose exec -T backup backup.sh
          echo "Falha do backup sai com erro"
          if docker compose exec -T -e RESTIC_PASSWORD=errada backup backup.sh; then exit 1; fi

      - name: Alerta de disco (issue #23)
        run: |
          set -euo pipefail
          echo "Disco abaixo do limite padrão"
          docker compose exec -T backup disco.sh
          echo "Limite de 1% dispara o alerta"
          if docker compose exec -T -e SGI_DISCO_LIMITE_PERCENTUAL=1 backup disco.sh; then exit 1; fi

      - name: Backup agendado pelo crond (issue #21)
        run: |
          set -euo pipefail
          sed -i "s|^SGI_BACKUP_HORARIO=.*|SGI_BACKUP_HORARIO=* * * * *|" backup.env
          # O snapshot mais recente muda quando o crond roda um backup (a retenção pode podar os antigos).
          ultimo() { docker compose exec -T backup restic snapshots --json latest | (grep -o '"id":"[^"]*"' || true) | head -1; }
          antes="$(ultimo)"
          docker compose up -d backup
          for _ in $(seq 1 30); do
            if [ "$(ultimo)" != "$antes" ]; then echo "crond gerou o snapshot"; exit 0; fi
            sleep 5
          done
          echo "o crond não rodou o backup em 150 segundos"
          docker compose exec -T backup sh -c 'ps; ls -la /etc/crontabs /var/spool/cron 2>&1; cat /etc/crontabs/root; date; busybox | head -3' || true
          exit 1

      - name: Recuperação de desastres (issue #22)
        run: |
          set -euo pipefail
          sql() { docker compose exec -T db sh -c "psql -v ON_ERROR_STOP=1 -tA -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"$1\""; }
          echo "Dados de referência: uma tabela no banco e um arquivo no volume"
          sql "create table ci_marcador (valor text); insert into ci_marcador values ('antes-do-desastre')"
          docker compose exec -T app sh -c 'mkdir -p /var/lib/sgi/arquivos/ci && echo conteudo-ficticio > /var/lib/sgi/arquivos/ci/marcador'
          docker compose exec -T backup backup.sh

          echo "Desastre: contêineres e volumes apagados; sobram o repositório restic e os .env"
          docker compose down -v
          inicio="$(date +%s)"

          echo "VPS nova: sobe só o banco, restaura e sobe o resto"
          docker compose up -d --wait db
          docker compose run --rm --no-deps -v cesjo-arquivos:/restauro/arquivos --entrypoint restaurar.sh backup
          docker compose up -d --wait --wait-timeout 240
          fim="$(date +%s)"

          echo "Banco restaurado"
          test "$(sql 'select valor from ci_marcador')" = "antes-do-desastre"
          test "$(sql 'select count(*) from conta_acesso')" = "1"
          echo "Arquivos restaurados e legíveis pela aplicação"
          test "$(docker compose exec -T app cat /var/lib/sgi/arquivos/ci/marcador)" = "conteudo-ficticio"
          docker compose exec -T app sh -c 'echo gravavel > /var/lib/sgi/arquivos/ci/escrita'
          echo "Sistema no ar"
          curl -fsSk https://localhost/saude | grep '"status":"UP"' > /dev/null
          echo "### Recuperação de desastres: $((fim - inicio)) s do banco vazio ao sistema no ar" >> "$GITHUB_STEP_SUMMARY"
          echo "restauração completa em $((fim - inicio)) s"

      - name: Logs da pilha
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Derrubar a pilha
        if: always()
        run: docker compose down -v

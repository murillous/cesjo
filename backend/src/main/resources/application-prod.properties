# Documentação da API (springdoc-openapi) desligada em produção.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Arquivos cifrados: sem SGI_ARQUIVOS_DIRETORIO a aplicação não sobe em produção (ADR 0026).
sgi.arquivos.diretorio=${SGI_ARQUIVOS_DIRETORIO}

# --- Acesso: cookie de sessão só por HTTPS em produção (ADR 0011) ---
server.servlet.session.cookie.secure=true

# --- Implantação atrás do Caddy (issue #20, ADR 0051) ---
# O Caddy termina o TLS e repassa X-Forwarded-*; o Tomcat só confia nesses cabeçalhos vindos de
# endereços internos (a rede do Docker Compose), então a aplicação enxerga o esquema https e o IP real.
server.forward-headers-strategy=native
# Encerramento gracioso: termina as requisições em andamento antes de parar o contêiner.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Documentação da API (springdoc-openapi) desligada em produção.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Arquivos cifrados: sem SGI_ARQUIVOS_DIRETORIO a aplicação não sobe em produção (ADR 0026).
sgi.arquivos.diretorio=${SGI_ARQUIVOS_DIRETORIO}

# --- Acesso: cookie de sessão só por HTTPS em produção (ADR 0011) ---
server.servlet.session.cookie.secure=true

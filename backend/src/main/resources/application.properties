spring.application.name=cesjo-sgi
server.port=${PORT:8080}

spring.datasource.url=jdbc:sqlite:${SQLITE_DB_PATH:../data/cesjo-mvp.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB

app.upload-dir=${UPLOAD_DIR:../data/uploads}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}

server.error.include-message=never
server.error.include-stacktrace=never

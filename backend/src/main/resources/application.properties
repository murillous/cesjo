spring.application.name=sgi-backend

# O esquema é das migrações do Flyway; o Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Interface e mensagens só em português.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Erros da API no formato ProblemDetail (RFC 9457).
spring.mvc.problemdetails.enabled=true

# Paginação padrão das listagens.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via_dto

# --- Arquivos cifrados (issue #18, ADR 0026 e ADR 0027) ---
# Diretório dos arquivos cifrados. Em desenvolvimento, backend/dados/arquivos (ignorado pelo git);
# em produção, obrigatório pela variável SGI_ARQUIVOS_DIRETORIO (application-prod.properties).
sgi.arquivos.diretorio=dados/arquivos
sgi.arquivos.tamanho-maximo=10MB
# O multipart aceita o arquivo no limite acima; a requisição tem 1 MB a mais para o envelope multipart.
spring.servlet.multipart.max-file-size=${sgi.arquivos.tamanho-maximo}
spring.servlet.multipart.max-request-size=11MB

# --- Acesso: login por sessão, bloqueio e senhas (issues #13 a #15) ---
# Sessão no servidor, expira após 30 minutos sem requisição (ADR 0011).
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
# Bloqueio temporário após tentativas erradas seguidas (ADR 0011).
sgi.acesso.tentativas-maximas=5
sgi.acesso.duracao-bloqueio=15m
# Tamanho mínimo de senha escolhida pela conta (ADR 0012).
sgi.acesso.senha-tamanho-minimo=12
# Primeira conta de Coordenador, criada na subida se não houver nenhuma conta (ADR 0014).
sgi.acesso.primeira-conta.login=${SGI_COORDENADOR_LOGIN:}
sgi.acesso.primeira-conta.nome=${SGI_COORDENADOR_NOME:}
sgi.acesso.primeira-conta.senha=${SGI_COORDENADOR_SENHA:}
